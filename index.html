<script>
    const BOT_TOKEN = '8935163750:AAHisVn77gJgtSCGotubYQ0-YIM6njyBkpo';
    const CHAT_ID = '1420807020';

    let isCooldown = false; 

    function sendChoice(num) {
        if (isCooldown) return; // 

        const nameInput = document.getElementById('username').value.trim();
        const statusDiv = document.getElementById('status');

        if (!nameInput) {
            alert('Сначала введите ваше имя!');
            return;
        }

        
        const text = `⚡️ *Нажатие!*\n👤 *Имя:* ${nameInput}\nвыбрал(а): *[ ${num} ]*`;

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: text,
                parse_mode: 'Markdown'
            })
        });

        
        startCooldown(10);
    }

    function startCooldown(seconds) {
        isCooldown = true;
        const buttons = document.querySelectorAll('.grid button');
        const statusDiv = document.getElementById('status');

        // Блокируем все кнопки
        buttons.forEach(btn => btn.disabled = true);

        let timeLeft = seconds;
        statusDiv.innerText = `Ответ отправлен! Повторить можно через ${timeLeft} сек.`;

        // Запускаем таймер каждую секунду
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                statusDiv.innerText = `Подождите ${timeLeft} сек. перед следующим нажатием...`;
            } else {
                clearInterval(timer);
                isCooldown = false;
                buttons.forEach(btn => btn.disabled = false); // Разблокируем кнопки
                statusDiv.innerText = 'Готово! Можно выбирать снова.';
            }
        }, 1000);
    }
</script>
