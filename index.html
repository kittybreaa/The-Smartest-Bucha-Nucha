<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Выбор варианта</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0d1117; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #30363d;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 320px;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            margin-bottom: 20px;
            text-align: center;
            outline: none;
            box-sizing: border-box;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button {
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #ffcc00;
            color: #000;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.96);
            background: #e6b800;
        }

        button:disabled {
            background: #444 !important;
            color: #888;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #status {
            margin-top: 18px;
            font-size: 14px;
            color: #2ea44f;
            min-height: 36px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0;">Введите имя:</h2>
    <input type="text" id="username" placeholder="Ваше имя..." autocomplete="off">

    <div class="grid">
        <button onclick="sendChoice(1)">1</button>
        <button onclick="sendChoice(2)">2</button>
        <button onclick="sendChoice(3)">3</button>
        <button onclick="sendChoice(4)">4</button>
    </div>

    <div id="status"></div>
</div>

<script>
    // Вставьте сюда вашу ссылку на развернутый Google Apps Script (Web App URL)
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwo8_yCHgwYCXXXl8Tgd3Olue23opWC2I6m6N-h_FH1MV_nrB3d-dbpPjuz0w8-Q44Tgw/exec';

    let isCooldown = false;

    function sendChoice(num) {
        if (isCooldown) return;

        const nameInput = document.getElementById('username').value.trim();

        if (!nameInput) {
            alert('Сначала введите ваше имя!');
            return;
        }

        const statusDiv = document.getElementById('status');
        statusDiv.style.color = '#2ea44f';
        statusDiv.innerText = 'Отправка...';

        const payload = {
            name: nameInput,
            choice: num
        };

        // Отправка данных в Google Таблицу
        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload)
        })
        .then(() => {
            statusDiv.style.color = '#2ea44f';
            statusDiv.innerText = `Ответ [ ${num} ] успешно принят!`;
            startCooldown(10);
        })
        .catch(error => {
            console.error('Ошибка:', error);
            statusDiv.style.color = '#f85149';
            statusDiv.innerText = 'Ошибка отправки. Попробуйте еще раз.';
        });
    }

    function startCooldown(seconds) {
        isCooldown = true;
        const buttons = document.querySelectorAll('.grid button');
        const statusDiv = document.getElementById('status');

        buttons.forEach(btn => btn.disabled = true);

        let timeLeft = seconds;
        statusDiv.innerText = `Отправлено! Пауза ${timeLeft} сек.`;

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                statusDiv.innerText = `Подождите ${timeLeft} сек...`;
            } else {
                clearInterval(timer);
                isCooldown = false;
                buttons.forEach(btn => btn.disabled = false);
                statusDiv.innerText = 'Можно выбирать!';
            }
        }, 1000);
    }
</script>

</body>
</html>
