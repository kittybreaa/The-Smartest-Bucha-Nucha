<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Викторина</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0d1117; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #30363d;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 320px;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
            box-sizing: border-box;
        }

        .section-title {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 8px;
            text-align: left;
        }

        /* Панель ведущего (скрыта по умолчанию для обычных игроков) */
        #adminPanel {
            display: none;
            background: #21262d;
            border: 1px solid #30363d;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .q-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .q-btn {
            padding: 8px;
            font-size: 14px;
            background: #161b22;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            cursor: pointer;
        }

        .q-btn.active {
            background: #1f6feb;
            color: white;
            border-color: #388bfd;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button.ans-btn {
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #ffcc00;
            color: #000;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        button.ans-btn:active {
            transform: scale(0.96);
            background: #e6b800;
        }

        button.ans-btn:disabled {
            background: #444 !important;
            color: #888;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #status {
            margin-top: 18px;
            font-size: 14px;
            color: #2ea44f;
            min-height: 36px;
            line-height: 1.4;
        }

        #currentQuestionIndicator {
            font-size: 15px;
            color: #58a6ff;
            margin-bottom: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0; font-size: 20px;">Викторина</h2>
    
    <input type="text" id="username" placeholder="Ваше имя..." autocomplete="off">

    <!-- ПАНЕЛЬ ВЕДУЩЕГО (видна только вам, если открыть ссылку с ?admin=1) -->
    <div id="adminPanel">
        <div class="section-title" style="color: #f0883e;">⚙️ Панель ведущего:</div>
        <div class="q-selector" id="qSelector">
            <button class="q-btn active" onclick="setQuestion(1)">1</button>
            <button class="q-btn" onclick="setQuestion(2)">2</button>
            <button class="q-btn" onclick="setQuestion(3)">3</button>
            <button class="q-btn" onclick="setQuestion(4)">4</button>
        </div>
    </div>

    <!-- Индикатор для игроков (показывает, какой вопрос сейчас активен) -->
    <div id="currentQuestionIndicator">Вопрос №1</div>

    <div class="section-title">Ваш вариант ответа:</div>
    <div class="grid">
        <button class="ans-btn" onclick="sendChoice(1)">1</button>
        <button class="ans-btn" onclick="sendChoice(2)">2</button>
        <button class="ans-btn" onclick="sendChoice(3)">3</button>
        <button class="ans-btn" onclick="sendChoice(4)">4</button>
    </div>

    <div id="status"></div>
</div>

<script>
    // Вставьте сюда вашу актуальную ссылку на Google Apps Script
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwo8_yCHgwYCXXXl8Tgd3Olue23opWC2I6m6N-h_FH1MV_nrB3d-dbpPjuz0w8-Q44Tgw/exec';

    let currentQuestion = 1;
    let isCooldown = false;

    // Проверяем, есть ли в ссылке ?admin=1 (чтобы показать панель управления вам)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === '1') {
        document.getElementById('adminPanel').style.display = 'block';
        document.getElementById('currentQuestionIndicator').innerText = 'Вы управляете вопросом №1';
    }

    function setQuestion(num) {
        currentQuestion = num;
        document.querySelectorAll('.q-btn').forEach(btn => btn.classList.remove('active'));
        // Находим нажатую кнопку по порядку
        event.target.classList.add('active');
        document.getElementById('currentQuestionIndicator').innerText = `Вы управляете вопросом №${num}`;
    }

    function sendChoice(num) {
        if (isCooldown) return;

        const nameInput = document.getElementById('username').value.trim();

        if (!nameInput) {
            alert('Сначала введите ваше имя!');
            return;
        }

        const statusDiv = document.getElementById('status');
        statusDiv.style.color = '#2ea44f';
        statusDiv.innerText = 'Отправка...';

        const payload = {
            name: nameInput,
            questionNum: currentQuestion,
            choice: num
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload)
        })
        .then(() => {
            statusDiv.style.color = '#2ea44f';
            statusDiv.innerText  = `Ответ [ ${num} ] на вопрос ${currentQuestion} принят!`;
            startCooldown(10);
        })
        .catch(error => {
            console.error('Ошибка:', error);
            statusDiv.style.color = '#f85149';
            statusDiv.innerText = 'Ошибка отправки. Попробуйте еще раз.';
        });
    }

    function startCooldown(seconds) {
        isCooldown = true;
        const buttons = document.querySelectorAll('.ans-btn');
        const statusDiv = document.getElementById('status');

        buttons.forEach(btn => btn.disabled = true);

        let timeLeft = seconds;
        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                statusDiv.innerText = `Подождите ${timeLeft} сек...`;
            } else {
                clearInterval(timer);
                isCooldown = false;
                buttons.forEach(btn => btn.disabled = false);
                statusDiv.innerText = 'Можно отвечать дальше!';
            }
        }, 1000);
    }
</script>

</body>
</html>
