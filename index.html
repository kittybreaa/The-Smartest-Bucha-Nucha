<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Викторина</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0d1117; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #30363d;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 360px;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
            box-sizing: border-box;
        }

        #questionIndicator {
            font-size: 16px;
            color: #58a6ff;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Панель ведущего */
        #adminPanel {
            display: none;
            background: #21262d;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .admin-title {
            font-size: 13px;
            color: #f0883e;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: left;
        }

        .q-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .q-btn {
            padding: 8px 0;
            font-size: 14px;
            background: #161b22;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            cursor: pointer;
        }

        .q-btn.active {
            background: #1f6feb;
            color: white;
            border-color: #388bfd;
            font-weight: bold;
        }

        #copyLinkBtn {
            width: 100%;
            padding: 10px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        button.ans-btn {
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #ffcc00;
            color: #000;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        button.ans-btn:active {
            transform: scale(0.96);
            background: #e6b800;
        }

        button.ans-btn:disabled {
            background: #444 !important;
            color: #888;
            cursor: not-allowed;
            opacity: 0.6;
        }

        #status {
            margin-top: 18px;
            font-size: 14px;
            color: #2ea44f;
            min-height: 36px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0; font-size: 20px;">Викторина</h2>
    
    <!-- Панель ведущего -->
    <div id="adminPanel">
        <div class="admin-title">⚙️ Панель ведущего: выбери вопрос</div>
        <div class="q-grid" id="qGrid"></div>
        <button id="copyLinkBtn" onclick="copyQuestionLink()">📋 Скопировать ссылку на этот вопрос</button>
    </div>

    <!-- Индикатор текущего вопроса у игрока -->
    <div id="questionIndicator">Вопрос №1</div>

    <input type="text" id="username" placeholder="Ваше имя..." autocomplete="off">

    <div class="grid">
        <button class="ans-btn" onclick="sendChoice(1)">1</button>
        <button class="ans-btn" onclick="sendChoice(2)">2</button>
        <button class="ans-btn" onclick="sendChoice(3)">3</button>
        <button class="ans-btn" onclick="sendChoice(4)">4</button>
    </div>

    <div id="status"></div>
</div>

<script>
    // Вставь сюда свою ссылку на Google Apps Script
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwo8_yCHgwYCXXXl8Tgd3Olue23opWC2I6m6N-h_FH1MV_nrB3d-dbpPjuz0w8-Q44Tgw/exec';

    let isCooldown = false;

    // Считываем номер вопроса из ссылки (?q=...)
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === '1';
    let currentQuestion = parseInt(urlParams.get('q')) || 1;

    if (isAdmin) {
        document.getElementById('adminPanel').style.display = 'block';
    }

    document.getElementById('questionIndicator').innerText = `Вопрос №${currentQuestion}`;

    // Генерируем кнопки для админ-панели (1-20)
    const qGrid = document.getElementById('qGrid');
    for (let i = 1; i <= 20; i++) {
        const btn = document.createElement('button');
        btn.className = i === currentQuestion ? 'q-btn active' : 'q-btn';
        btn.innerText = i;
        btn.onclick = () => {
            // Переходим на ту же страницу, но с новым номером вопроса в ссылке
            const baseUrl = window.location.origin + window.location.pathname;
            window.location.href = `${baseUrl}?admin=1&q=${i}`;
        };
        qGrid.appendChild(btn);
    }

    // Функция копирования готовой ссылки для игроков на этот вопрос
    function copyQuestionLink() {
        const baseUrl = window.location.origin + window.location.pathname;
        const playerLink = `${baseUrl}?q=${currentQuestion}`;
        
        navigator.clipboard.writeText(playerLink).then(() => {
            const btn = document.getElementById('copyLinkBtn');
            btn.innerText = '✅ Ссылка скопирована!';
            setTimeout(() => { btn.innerText = '📋 Скопировать ссылку на этот вопрос'; }, 2000);
        });
    }

    function sendChoice(num) {
        if (isCooldown) return;

        const nameInput = document.getElementById('username').value.trim();

        if (!nameInput) {
            alert('Сначала введите ваше имя!');
            return;
        }

        const statusDiv = document.getElementById('status');
        statusDiv.style.color = '#2ea44f';
        statusDiv.innerText = 'Отправка...';

        const payload = {
            name: nameInput,
            questionNum: currentQuestion,
            choice: num
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload)
        })
        .then(() => {
            statusDiv.style.color = '#2ea44f';
            statusDiv.innerText = `Ответ [ ${num} ] на вопрос ${currentQuestion} принят!`;
            startCooldown(10);
        })
        .catch(error => {
            console.error('Ошибка:', error);
            statusDiv.style.color = '#f85149';
            statusDiv.innerText = 'Ошибка отправки. Попробуйте еще раз.';
        });
    }

    function startCooldown(seconds) {
        isCooldown = true;
        const buttons = document.querySelectorAll('.grid button');
        const statusDiv = document.getElementById('status');

        buttons.forEach(btn => btn.disabled = true);

        let timeLeft = seconds;
        statusDiv.innerText = `Отправлено! Пауза ${timeLeft} сек.`;

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                statusDiv.innerText = `Подождите ${timeLeft} сек...`;
            } else {
                clearInterval(timer);
                isCooldown = false;
                buttons.forEach(btn => btn.disabled = false);
                statusDiv.innerText = 'Можно выбирать!';
            }
        }, 1000);
    }
</script>

</body>
</html>

</body>
</html>
